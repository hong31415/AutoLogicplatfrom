<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>AutoLogic Studio — Anonymous Demo Video</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #17201f;
        background: #f3f5f3;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 0%, rgba(8, 125, 116, .09), transparent 30rem),
          #f3f5f3;
      }

      main {
        width: min(1440px, calc(100% - 40px));
        margin: 0 auto;
        padding: 30px 0 42px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #087d74;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Times New Roman", Times, serif;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        line-height: 1.05;
      }

      .meta {
        margin: 8px 0 0;
        color: #63706d;
        font-size: .96rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 9px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 15px;
        color: #155c56;
        border: 1px solid #aec9c5;
        border-radius: 8px;
        background: #fff;
        font-size: .9rem;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        color: #fff;
        border-color: #087d74;
        background: #087d74;
        outline: none;
      }

      .player-shell {
        overflow: hidden;
        border: 1px solid #cfd8d5;
        border-radius: 14px;
        background: #0d1111;
        box-shadow: 0 20px 54px rgba(24, 32, 31, .14);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0d1111;
      }

      .note {
        margin: 14px 2px 0;
        color: #63706d;
        font-size: .86rem;
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 1440px);
          padding-top: 20px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        nav { justify-content: flex-start; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Anonymous supplementary material</p>
          <h1>AutoLogic Studio Demo</h1>
          <p class="meta">4 min 56 sec · 2560 × 1440 · English narration and subtitles</p>
        </div>
        <nav aria-label="Demo resources">
          <a href="./">Open Interactive Demo</a>
          <a href="https://anonymous.4open.science/r/autologic-review/">View Anonymous Repository</a>
        </nav>
      </header>

      <section class="player-shell" aria-label="AutoLogic Studio demonstration video">
        <video
          controls
          playsinline
          preload="metadata"
          poster="./assets/video/autologic-demo-poster.jpg"
        >
          <source src="./assets/video/autologic-demo.mp4" type="video/mp4" />
          Your browser cannot play this video. You can
          <a href="./assets/video/autologic-demo.mp4">open the MP4 file directly</a>.
        </video>
      </section>

      <p class="note">
        This page contains no author or affiliation information and is intended for anonymous review.
      </p>
    </main>
  </body>
</html>
